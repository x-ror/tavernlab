<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TavernLab — порада</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14161c;
    --panel: #1c1f28;
    --line: #2b303c;
    --ink: #e8eaf0;
    --dim: #8b93a6;
    --accent: #f0b429;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 14px;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 {
    margin: 0 0 12px;
    font-size: 15px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: .01em;
  }
  section {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 10px;
  }
  h2 {
    margin: 0 0 6px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
    color: var(--dim);
  }
  /* The turn plan is the thing being looked up mid-game, so it is the one
     section that reads as a numbered list rather than as prose. */
  section.plan { border-color: var(--accent); }
  section.plan ol { margin: 0; padding-left: 22px; }
  section.plan li { margin: 3px 0; }
  ul { margin: 0; padding-left: 16px; list-style: none; }
  li { margin: 2px 0; word-break: break-word; }
  footer { color: var(--dim); font-size: 12px; margin-top: 12px; }
  .stale { color: #e06c5a; }
</style>
<h1 id="title">…</h1>
<div id="body"></div>
<footer id="foot"></footer>
<script>
  const titleEl = document.getElementById('title');
  const bodyEl = document.getElementById('body');
  const footEl = document.getElementById('foot');
  let misses = 0;

  function render(data) {
    titleEl.textContent = data.title;
    bodyEl.replaceChildren(...data.sections.map(s => {
      const sec = document.createElement('section');
      // The turn is a sequence: do this, then this. A numbered list says that
      // and a bulleted one does not.
      const plan = s.heading === 'ХІД';
      if (plan) sec.className = 'plan';
      const h = document.createElement('h2');
      h.textContent = s.heading;
      const list = document.createElement(plan ? 'ol' : 'ul');
      for (const line of s.lines) {
        const li = document.createElement('li');
        li.textContent = line;
        list.append(li);
      }
      sec.append(h, list);
      return sec;
    }));
  }

  async function tick() {
    try {
      const res = await fetch('advice.json', { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      render(await res.json());
      misses = 0;
      footEl.className = '';
      footEl.textContent = 'оновлено ' + new Date().toLocaleTimeString();
    } catch (e) {
      // Say it, rather than leaving the last advice on screen looking live:
      // stale advice about a board that has moved on is worse than none.
      misses++;
      footEl.className = 'stale';
      footEl.textContent = 'немає зв’язку зі спостерігачем (' + misses + ') — порада нижче застаріла';
    }
  }
  tick();
  setInterval(tick, 1000);
</script>
