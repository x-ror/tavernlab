<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TavernLab</title>
<style>
:root{
  --surface:#fcfcfb; --card:#f4f3f0; --card2:#ece9e4; --border:#e2e1dc;
  --ink:#0b0b0b; --ink2:#52514e; --accent:#2a78d6; --pos:#2a78d6;
  --neg:#e34948; --good:#008300;
}
@media (prefers-color-scheme: dark){
  :root{
    --surface:#1a1a19; --card:#232322; --card2:#2b2b29; --border:#343433;
    --ink:#fff; --ink2:#c3c2b7; --accent:#3987e5; --pos:#3987e5;
    --neg:#e66767; --good:#4caf50;
  }
}
*{box-sizing:border-box}
body{margin:0; padding:0 18px 70px; background:var(--surface); color:var(--ink);
  font-family:system-ui,"Segoe UI",sans-serif; font-size:16px; line-height:1.5;}
main{max-width:900px; margin:0 auto;}
h1{font-size:2.1rem; margin:1em 0 .1em;}
h1 .v{color:var(--accent);}
h2{font-size:1.25rem; margin:.2em 0 .4em;}
.sub{color:var(--ink2); margin-top:0;}
.tabs{display:flex; gap:6px; margin:20px 0 16px; flex-wrap:wrap;}
.tabs button{border:1px solid var(--border); background:var(--card);
  color:var(--ink2); font:inherit; font-weight:600; padding:9px 16px;
  border-radius:9px; cursor:pointer;}
.tabs button.on{background:var(--accent); border-color:var(--accent); color:#fff;}
.pane{display:none;} .pane.on{display:block;}
textarea,input,select{width:100%; background:var(--card); color:var(--ink);
  border:1px solid var(--border); border-radius:9px; padding:10px 12px;
  font:inherit;}
textarea{font-family:ui-monospace,monospace; font-size:.8rem; min-height:74px;}
label{display:block; font-weight:600; font-size:.9rem; margin:14px 0 5px;}
.btn{border:0; background:var(--accent); color:#fff; font:inherit;
  font-weight:700; padding:11px 22px; border-radius:9px; cursor:pointer;
  margin-top:14px;}
.btn.sec{background:var(--card2); color:var(--ink); border:1px solid var(--border);}
.btn:disabled{opacity:.5; cursor:wait;}
.prog{font-family:ui-monospace,monospace; font-size:.78rem; color:var(--ink2);
  background:var(--card); border:1px solid var(--border); border-radius:9px;
  padding:10px 14px; margin-top:12px; white-space:pre-wrap; display:none;
  max-height:160px; overflow-y:auto;}
.big{font-size:2.3rem; font-weight:800; color:var(--accent);
  font-variant-numeric:tabular-nums;}
.brow{display:grid; grid-template-columns:180px 1fr 52px; gap:10px;
  align-items:center; margin:5px 0; max-width:640px;}
.brow .n{font-size:.85rem; color:var(--ink2); text-align:right; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis;}
.brow .track{background:var(--card2); border-radius:4px; height:14px; position:relative;}
.brow .fill{position:absolute; inset:0 auto 0 0; border-radius:4px; min-width:2px;}
.brow .v{font-size:.85rem; font-weight:600; font-variant-numeric:tabular-nums;}
.card-block{background:var(--card); border:1px solid var(--border);
  border-radius:12px; padding:18px 22px; margin:16px 0;}
.verdict{display:flex; gap:12px; align-items:baseline; padding:8px 0;
  border-bottom:1px solid var(--border);}
.verdict:last-child{border-bottom:0;}
.verdict .k{font-weight:800; min-width:92px;}
.keep{color:var(--good);} .toss{color:var(--neg);}
.verdict .why{color:var(--ink2); font-size:.85rem;}
.threat{padding:4px 0; font-size:.92rem;}
.threat .c{color:var(--accent); font-weight:700;}
.threat .t{color:var(--ink2); font-size:.82rem;}
.err{color:var(--neg); font-weight:600; margin-top:10px;}
.good{color:var(--good); font-weight:600; margin-top:10px;}
.swap{padding:5px 0;} .swap b{color:var(--good);}
ul{padding-left:1.2em;}
.small{font-size:.84rem; color:var(--ink2);}
.mini{font-size:.76rem; color:var(--ink2); margin:4px 0;}
/* ---- games library ---- */
.row2{display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end;}
.row2>div{flex:1 1 190px;}
table.games{width:100%; border-collapse:collapse; margin-top:14px;
  font-size:.9rem;}
table.games th{text-align:left; font-size:.76rem; color:var(--ink2);
  font-weight:700; padding:6px 8px; border-bottom:1px solid var(--border);}
table.games td{padding:9px 8px; border-bottom:1px solid var(--border);
  vertical-align:top;}
table.games tbody tr{cursor:pointer;}
table.games tbody tr:hover{background:var(--card);}
.win{color:var(--good); font-weight:700;}
.loss{color:var(--neg); font-weight:700;}
.tie,.unknown{color:var(--ink2); font-weight:700;}
.badge{display:inline-block; font-size:.72rem; font-weight:700; padding:2px 8px;
  border-radius:999px; background:var(--card2); color:var(--ink2);
  border:1px solid var(--border);}
.badge.ready{color:var(--good);} .badge.pending{color:var(--accent);}
.badge.error{color:var(--neg);}
/* ---- review ---- */
.rhead{display:flex; gap:12px; align-items:baseline; flex-wrap:wrap;}
.big2{font-size:1.4rem;}
.chip{display:inline-block; font-size:.75rem; padding:2px 9px;
  margin:2px 5px 2px 0; border-radius:7px; background:var(--card2);
  color:var(--ink2);}
.chip.hot{background:var(--neg); color:#fff; font-weight:700;}
.tag{display:inline-block; font-size:.68rem; border:1px solid var(--border);
  border-radius:5px; padding:1px 6px; color:var(--ink2);}
.caveats{border-left:3px solid var(--border); padding:2px 0 2px 12px;
  margin:12px 0; color:var(--ink2); font-size:.85rem;}
.moment{cursor:pointer; padding:8px 11px; border:1px solid var(--border);
  border-radius:9px; margin:7px 0; background:var(--card2); font-size:.9rem;}
.moment.lethal{border-color:var(--neg); border-width:2px;}
details.turn{border:1px solid var(--border); border-radius:10px; margin:8px 0;
  background:var(--surface);}
details.turn>summary{cursor:pointer; padding:9px 12px; font-weight:600;}
details.turn.flash{outline:2px solid var(--accent);}
.turnbody{padding:0 14px 12px;}
.dec{border-top:1px solid var(--border); padding:10px 0;}
.dec.them{opacity:.6;}
.dec.lethal{border:2px solid var(--neg); border-radius:10px; padding:11px 13px;
  margin:10px 0; background:var(--card2);}
.dec .strong{color:var(--neg); font-weight:800;}
.glyph{font-weight:800; color:var(--ink2); margin-right:9px;}
.dec.lethal .glyph{color:var(--neg);}
.what{font-weight:600; margin-right:8px;}
.reason{font-family:ui-monospace,monospace; font-size:.74rem; color:var(--ink2);
  margin-top:6px; word-break:break-word;}
.lg{display:flex; gap:9px; align-items:baseline; flex-wrap:wrap;
  padding:7px 0; border-bottom:1px solid var(--border);}
.lg:last-child{border-bottom:0;}
.lg.off{opacity:.42;}
.lg .k{font-weight:700; min-width:150px;}
svg.wp{width:100%; height:auto; display:block; margin:10px 0 4px;}
/* ---- import / settings ---- */
pre.cfg{background:var(--card2); border:1px solid var(--border);
  border-radius:9px; padding:12px 14px; font-size:.8rem; overflow-x:auto;
  white-space:pre;}
code.path{background:var(--card2); border-radius:5px; padding:2px 6px;
  font-size:.8rem; word-break:break-all;}
.chk{display:flex; gap:9px; align-items:center; font-weight:400;
  margin:10px 0; font-size:.92rem;}
.chk input{width:auto;}
.warn{border-color:var(--neg);}
/* ---- replay (S3) + inspector (S4) ---- */
.rctl{display:flex; gap:6px; flex-wrap:wrap; align-items:center;
  margin-top:10px;}
.rctl .btn{margin-top:0; padding:8px 13px; font-size:.85rem;}
input[type=range]{padding:0; margin:12px 0 4px; accent-color:var(--accent);}
.rmeta{display:flex; gap:9px; align-items:center; flex-wrap:wrap;
  margin:10px 0;}
.rboard{display:grid; gap:7px; background:var(--card); padding:12px;
  border:1px solid var(--border); border-radius:12px; margin:12px 0;}
.rrow{display:flex; gap:6px; flex-wrap:wrap; align-items:stretch;
  min-height:40px;}
.rrow.mid{justify-content:center;}
.rline{height:1px; background:var(--border); margin:4px 0;}
.ent{border:1px solid var(--border); border-radius:8px; background:var(--card2);
  padding:5px 8px; font-size:.75rem; min-width:76px; max-width:130px;}
.ent .nm{font-weight:600; white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis;}
.ent .st{color:var(--ink2); font-variant-numeric:tabular-nums;}
.ent.taunt{border-color:var(--accent); border-width:2px;}
.ent.ds{outline:2px solid var(--good); outline-offset:-3px;}
.ent.unimpl{border-style:dashed;}
.ent.back{min-width:26px; max-width:26px; background:var(--border);
  color:transparent;}
.ent.hero{min-width:150px; background:var(--surface);}
.lrow{display:flex; gap:9px; align-items:baseline; padding:5px 8px;
  border-bottom:1px solid var(--border); cursor:pointer; font-size:.85rem;}
.lrow.on{background:var(--card2); font-weight:600;}
.lrow.them{opacity:.62;}
.lnk{border:0; background:none; color:var(--accent); font:inherit;
  font-size:.76rem; padding:0; cursor:pointer; text-decoration:underline;}
table.alts{width:100%; border-collapse:collapse; font-size:.85rem;
  margin:6px 0;}
table.alts th{text-align:left; font-size:.74rem; color:var(--ink2);
  padding:5px 7px; border-bottom:1px solid var(--border);}
table.alts td{padding:6px 7px; border-bottom:1px solid var(--border);}
.badge.blocked{color:var(--neg);}
tr.blocked{cursor:default; opacity:.72;}
.hide{display:none;}
</style>
<main>
<h1><span data-i18n="app.brand_a"></span><span class="v"
  data-i18n="app.brand_b"></span></h1>
<p class="sub" data-i18n="app.sub"></p>

<label data-i18n="deck.label"></label>
<textarea id="code" data-i18n-ph="deck.ph"></textarea>

<div class="tabs">
  <button data-p="games" class="on" data-i18n="tab.games"></button>
  <button data-p="review" data-i18n="tab.review"></button>
  <button data-p="replay" data-i18n="tab.replay"></button>
  <button data-p="import" data-i18n="tab.import"></button>
  <button data-p="analyze" data-i18n="tab.analyze"></button>
  <button data-p="mull" data-i18n="tab.mull"></button>
  <button data-p="opp" data-i18n="tab.opp"></button>
  <button data-p="coach" data-i18n="tab.coach"></button>
  <button data-p="settings" data-i18n="tab.settings"></button>
</div>

<div class="pane on" id="p-games">
  <div class="row2">
    <div><label data-i18n="games.filter_class"></label>
      <select id="gClass"></select></div>
    <div><label data-i18n="games.filter_result"></label>
      <select id="gResult"></select></div>
  </div>
  <button class="btn sec" id="bGames" data-i18n="games.refresh"></button>
  <div id="outG"></div>
</div>

<div class="pane" id="p-review">

</div>
<!-- /p-review -->

<div class="pane" id="p-replay">
  <div id="rpHead"></div>
  <div class="rctl hide" id="rpCtl">
    <button class="btn sec" id="rpFirst" data-i18n="replay.first"></button>
    <button class="btn sec" id="rpPrevTurn" data-i18n="replay.prev_turn"></button>
    <button class="btn sec" id="rpPrev" data-i18n="replay.prev"></button>
    <button class="btn" id="rpPlay" data-i18n="replay.play"></button>
    <button class="btn sec" id="rpNext" data-i18n="replay.next"></button>
    <button class="btn sec" id="rpNextTurn" data-i18n="replay.next_turn"></button>
    <button class="btn sec" id="rpLast" data-i18n="replay.last"></button>
  </div>
  <input type="range" id="rpScrub" class="hide" min="0" max="0" value="0">
  <div id="rpBoard"></div>
  <div id="rpInspect"></div>
  <details class="turn" id="rpLogWrap">
    <summary data-i18n="replay.log"></summary>
    <div class="turnbody" id="rpLog"></div>
  </details>
</div>
<!-- /p-replay -->

<div class="pane" id="p-import">
  <p class="small" data-i18n="import.intro"></p>
  <p class="small" data-i18n="import.readonly"></p>
  <label data-i18n="import.path_label"></label>
  <input id="iPath" data-i18n-ph="import.path_ph">
  <button class="btn" id="bImport" data-i18n="import.btn_log"></button>
  <button class="btn sec" id="bImportLast" data-i18n="import.btn_last"></button>
  <div class="prog" id="progI"></div>
  <div id="outI"></div>
  <div class="card-block">
    <h2 data-i18n="import.cfg_title"></h2>
    <p class="small" data-i18n="import.cfg_help"></p>
    <p class="small" data-i18n="import.cfg_where"></p>
    <p><code class="path" id="cfgPath">%LOCALAPPDATA%\Blizzard\Hearthstone\log.config</code></p>
<pre class="cfg" id="logcfg">[Power]
LogLevel=1
FilePrinting=true
ConsolePrinting=false
ScreenPrinting=false
Verbose=true
[Zone]
LogLevel=1
FilePrinting=true</pre>
    <button class="btn sec" id="bCopyCfg" data-i18n="import.copy"></button>
    <p class="small" data-i18n="import.manual_only"></p>
    <label class="chk"><input type="checkbox" id="iRestarted">

</div>

<div class="pane" id="p-analyze">
  <button class="btn" id="bAnalyze" data-i18n="analyze.run"></button>
  <button class="btn sec" id="bOptimize" data-i18n="analyze.optimize"></button>

  <div id="outO"></div>
</div>
<!-- /p-analyze -->

<div class="pane" id="p-mull">

  <datalist id="cardlist"></datalist>
  <button class="btn" id="bMull" data-i18n="mull.run"></button>

</div>
<!-- /p-mull -->

<div class="pane" id="p-opp">
  <label data-i18n="opp.class_label"></label>
  <select id="oOpp"></select>
  <label data-i18n="opp.seen_label"></label>
  <input id="oSeen" list="cardlist" data-i18n-ph="opp.seen_ph">
  <button class="btn" id="bPredict" data-i18n="opp.run"></button>
  <div id="outP"></div>
</div>
<!-- /p-opp -->

<div class="pane" id="p-coach">
  <p class="small" data-i18n="coach.intro"></p>

</div>

<div class="pane" id="p-settings">
  <label data-i18n="settings.logs_dir"></label>
  <input id="sLogs" data-i18n-ph="settings.logs_dir_ph">
  <label data-i18n="settings.player_name"></label>
  <input id="sPlayer" data-i18n-ph="settings.player_name_ph">
  <p class="small" data-i18n="settings.player_name_hint"></p>

  <input id="sDeck" data-i18n-ph="deck.ph">

    <option value="" data-i18n="settings.lang_auto"></option>

  </select>
  <div class="card-block warn">
    <h2 data-i18n="settings.live_title"></h2>

      <span data-i18n="settings.live_eval"></span></label>

      value="line" checked><span data-i18n="settings.live_mode_line"></span></label>

      value="hint" disabled><span data-i18n="settings.live_mode_hint"></span>
      <span class="tag" data-i18n="settings.v1_tag"></span></label>
  </div>
  <button class="btn" id="bSaveSettings" data-i18n="settings.save"></button>
  <div id="outS"></div>

</main>
<script>
const $=id=>document.getElementById(id);
const CLASSES=["DEATHKNIGHT","DEMONHUNTER","DRUID","HUNTER","MAGE","PALADIN",
 "PRIEST","ROGUE","SHAMAN","WARLOCK","WARRIOR"];
const RESULTS=["win","loss","tie"];
const LS_LANG="tavernlab.lang";

/* ---------------------------------------------------------------- i18n */
let I18N={}, LANG="en";
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,c=>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
}
function t(key,vars){
  let s=I18N[key];
  if(s===undefined) s=key;
  if(vars) s=s.replace(/\{(\w+)\}/g,(m,k)=>k in vars?String(vars[k]):m);
  return s;
}
/* Prefixed lookup (label.*, class.*, result.*, ...). Unknown values fall
   back to the raw server string instead of printing a key. */
function tk(prefix,key){
  const raw=(key===null||key===undefined||key==="")?"unknown":key;
  const s=I18N[prefix+"."+raw];
  return s===undefined?String(key==null?"":key):s;
}
function lsGet(k){try{return localStorage.getItem(k)||"";}catch(e){return "";}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function pickLang(pref){
  const v=String(pref||"").toLowerCase();
  if(v.indexOf("uk")===0) return "uk";
  if(v.indexOf("en")===0) return "en";
  const nav=String(navigator.language||"en").toLowerCase();
  return nav.indexOf("uk")===0?"uk":"en";
}
async function setLang(pref){
  const want=pickLang(pref);
  try{
    const r=await fetch("/locales/"+want+".json");
    if(r.ok){I18N=await r.json(); LANG=want; lsSet(LS_LANG,want);}
  }catch(e){}
  applyI18n();
}
function applyI18n(){
  document.documentElement.lang=LANG;
  document.title=t("app.title");
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    el.textContent=t(el.getAttribute("data-i18n"));
  });
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{
    el.setAttribute("placeholder",t(el.getAttribute("data-i18n-ph")));
  });
  fillSelects();
  redraw();
}
function opt(value,label){
  const o=document.createElement("option");
  o.value=value; o.textContent=label; return o;
}
function fillSelects(){
  for(const s of [$("mOpp"),$("oOpp")]){
    const keep=s.value; s.innerHTML="";
    for(const c of CLASSES) s.appendChild(opt(c,tk("class",c)));
    if(keep) s.value=keep;
  }
  const gc=$("gClass"), gr=$("gResult");
  const keepC=gc.value, keepR=gr.value;
  gc.innerHTML=""; gc.appendChild(opt("",t("games.any")));
  for(const c of CLASSES) gc.appendChild(opt(c,tk("class",c)));
  gr.innerHTML=""; gr.appendChild(opt("",t("games.any")));
  for(const r of RESULTS) gr.appendChild(opt(r,tk("result",r)));
  gc.value=keepC; gr.value=keepR;
}
function redraw(){
  renderGames(); renderReview(); renderReplay(); renderCoach();
}

/* ---------------------------------------------------------------- http */
/* `api()` is POST-only; every GET route needs `getJSON` (design §2.7). */
async function api(path,body){const r=await fetch(path,{method:"POST",
  body:JSON.stringify(body||{})}); return r.json();}
async function getJSON(path){
  const r=await fetch(path,{headers:{"Accept":"application/json"}});
  let data=null;
  try{data=await r.json();}catch(e){data=null;}
  if(data===null) throw new Error("HTTP "+r.status+" "+path);
  data._http=r.status;
  return data;
}
function gameUrl(id,sub){
  return "/api/games/"+encodeURIComponent(id)+(sub?"/"+sub:"");
}
async function poll(jid,progEl){
  while(true){
    const r=await (await fetch("/api/job/"+jid)).json();
    if(progEl){progEl.style.display="block";
      progEl.textContent=r.progress.slice(-8).join("\n");
      progEl.scrollTop=progEl.scrollHeight;}
    if(r.status!=="running") return r;
    await new Promise(x=>setTimeout(x,700));
  }
}
function showTab(name){
  const b=document.querySelector('.tabs button[data-p="'+name+'"]');
  if(b) b.click();
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));
  document.querySelectorAll(".pane").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); $("p-"+b.dataset.p).classList.add("on");
});
function bars(rates){
  const ent=Object.entries(rates).sort((a,b)=>b[1]-a[1]);
  return ent.map(([n,v])=>`<div class="brow"><div class="n">${esc(n)}</div>
    <div class="track"><div class="fill" style="width:${(v*100).toFixed(1)}%;
    background:${v>=0.5?'var(--pos)':'var(--neg)'}"></div></div>
    <div class="v">${(v*100).toFixed(0)}%</div></div>`).join("");
}

/* ------------------------------------------------------------ S1 games */
let gamesData=null;
async function loadGames(){
  const q=new URLSearchParams();
  q.set("limit","100");
  if($("gClass").value) q.set("class",$("gClass").value);
  if($("gResult").value) q.set("result",$("gResult").value);
  $("outG").innerHTML=`<p class="small">${esc(t("common.loading"))}</p>`;
  try{
    const d=await getJSON("/api/games?"+q.toString());
    if(d.error) throw new Error(d.error);
    gamesData=d.games||[];
    renderGames();
  }catch(e){
    $("outG").innerHTML=`<p class="err">${esc(e.message)}</p>`;
  }
  return gamesData||[];
}
function fmtDate(v){
  if(!v) return t("common.na");
  const d=new Date(typeof v==="number"?v*1000:v);
  if(isNaN(d.getTime())) return String(v);
  return d.toLocaleString(LANG==="uk"?"uk-UA":"en-GB",
    {year:"numeric",month:"2-digit",day:"2-digit",
     hour:"2-digit",minute:"2-digit"});
}
function orderText(first){
  if(first===null||first===undefined) return t("common.na");
  return first?t("games.first"):t("games.second");
}
function archText(name,conf){
  if(!name) return "";
  if(conf===null||conf===undefined) return String(name);
  return t("games.arch_conf",{arch:name,conf:Math.round(conf*100)});
}
function renderGames(){

/* ----------------------------------------------------------- S2 review */
let reviewData=null, reviewGame=null, reviewId=null, labelsMeta=null;
async function openReview(id){
  reviewId=id; reviewData=null; reviewGame=null; momentIdx=-1;
  showTab("review");
  await loadReview();
}
async function loadReview(){
  if(!reviewId){renderReview(); return;}
  $("outR").innerHTML=`<p class="small">${esc(t("common.loading"))}</p>`;
  try{
    if(!labelsMeta){
      try{labelsMeta=await getJSON("/api/labels");}catch(e){labelsMeta=null;}
    }
    const g=await getJSON(gameUrl(reviewId));
    reviewGame=g.game||null;
    reviewData=await getJSON(gameUrl(reviewId,"review"));
    renderReview();
  }catch(e){
    $("outR").innerHTML=`<p class="err">${esc(e.message)}</p>`;
  }
}
function wpCaveat(){
  if(labelsMeta&&labelsMeta.wp_caveat) return labelsMeta.wp_caveat;
  const cav=((reviewData||{}).report||{}).caveats||[];
  return cav[0]||"";
}
function legendData(){
  if(reviewData&&reviewData.labels_legend) return reviewData.labels_legend;
  return (labelsMeta||{}).labels||[];
}
function renderReview(){
  if(!reviewId||!reviewData){
    if(!$("outR")) return;
    $("outR").innerHTML=`<div class="card-block">
      <p>${esc(t("review.pick"))}</p>
      <button class="btn sec" id="bToGames">${esc(t("review.to_games"))}
      </button></div>`;
    $("bToGames").onclick=()=>showTab("games");
    return;
  }
  const r=reviewData;

  let h=reviewHeader(r.status==="ready"&&!blocked)+blockedHtml();

    h+=`<div class="card-block">
      <p><b>${esc(t("review.status",
        {status:tk("review_status",r.status||"none")}))}</b></p>`;

        </button>`;
    h+="</div>";
    $("outR").innerHTML=h;
    wireReview();
    return;
  }
  const rep=r.report||{};
  h+=`<div class="card-block"><h2>${esc(rep.headline||"")}</h2>`;
  if((rep.bullets||[]).length)
    h+="<ul>"+rep.bullets.map(b=>`<li>${esc(b)}</li>`).join("")+"</ul>";
  h+=`<div class="caveats"><b>${esc(t("review.caveats"))}</b><ul>`+
    (rep.caveats||[]).map(c=>`<li>${esc(c)}</li>`).join("")+
    `</ul></div><p class="mini">${esc(t("review.search_off"))}</p></div>`;
  h+=`<div class="card-block"><h2>${esc(t("review.wp_title"))}</h2>`+
    sparkline(r.wp_series||[],r.key_moments||[])+
    `<p class="mini">${esc(t("review.wp_hatched"))}</p>
     <p class="mini">${esc(wpCaveat())}</p></div>`;
  h+=`<div class="card-block"><h2>${esc(t("review.key_moments"))}</h2>`+

    <p class="small">${esc(t("review.legend_help"))}</p>`+

    (r.turns||[]).map(turnHtml).join("")+"</div>";

function blockedHtml(){
  const g=reviewGame||{};

    <p class="small">${esc(g.review_blocked||"")}</p></div>`;

function wireReview(){

  const b=$("bReanalyse"); if(b) b.onclick=analyseGame;

function reviewHeader(withReanalyse){

    ${withReanalyse?`<button class="btn sec" id="bReanalyse">

async function analyseGame(){
  if(!reviewId) return;
  const btn=$("bAnalyseGame")||$("bReanalyse");
  if(btn) btn.disabled=true;
  try{
    const path=gameUrl(reviewId,"analyze");
    const d=await api(path,{});
    if(d.error) throw new Error(d.error);
    const r=await poll(d.job,$("progR"));
    if(r.status==="error") throw new Error(r.error);
    await loadReview();
    await loadGames();
  }catch(e){
    $("outR").insertAdjacentHTML("beforeend",

function gotoTurn(turn){

let momentIdx=-1;

function betterText(b){

function listBlock(title,items){

function choicesHtml(choices){

    c.cost==null?"":" ("+esc(c.cost)+")"}</span>`;

function lethalPlanFor(d,rev){
  const ms=((rev||{}).key_moments)||[];
  for(const m of ms)
    if(m.label==="missed_lethal"&&m.seq!=null&&m.seq===d.seq)
      return m.detail||"";

/* S4 alternatives: the lethal line if there is one. Never a ΔWP rank —
   `search_ok=0`, so nothing in this build may order plays. */
function altsHtml(d,rev){
  const e=d.explanation||{};
  const rows=[];
  const plan=lethalPlanFor(d,rev);
  if(plan) rows.push([t("inspector.lethal_line"),plan]);
  (e.better||[]).forEach(b=>rows.push([t("inspector.alt_better"),
    betterText(b)]));
  let body=rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`)
    .join("");
  if(!body)
    body=`<tr><td colspan="2">${esc(t("inspector.no_alternatives"))}</td></tr>`;
  return `<table class="alts"><thead><tr>
    <th>${esc(t("inspector.alt_kind"))}</th>
    <th>${esc(t("inspector.alt_line"))}</th></tr></thead>
    <tbody>${body}</tbody></table>
    <p class="mini">${esc(t("inspector.no_dwp"))}</p>`;
}
function whyWrongHtml(d){
  const e=d.explanation||{};
  const lines=(e.caveats||[]).slice();
  if(d.label_reason) lines.push(d.label_reason);
  /* `lethal_ok` says the overlay of this position is sound; it does NOT
     say the solver ran here. The deep search has a budget and fires
     twice per our turn, so without this line a quiet ply reads as
     "checked, no lethal" when nobody checked it. */
  if(d.side==="us"&&d.lethal_checked===false)
    lines.push(t("review.lethal_not_checked"));
  lines.push(t("review.search_off"));
  return `<div class="caveats"><b>${esc(t("inspector.why_wrong"))}</b>`+
    lines.map(x=>`<div>${esc(x)}</div>`).join("")+"</div>";
}
function decHtml(d,inspector){
  const e=d.explanation||{};
  const rev=inspector?replayReview:reviewData;
  const lethal=d.label==="missed_lethal";
  const cls="dec"+(lethal?" lethal":"")+(d.side==="them"?" them":"");
  const chosen=d.chosen||{};
  let h=`<div class="${cls}"><div class="dhead">
    <span class="glyph" title="${esc(d.label_reason||"")}">
    ${esc(d.label?tk("label",d.label):t("label.none"))}

    <span class="tag">${esc(tk("kind",d.kind))}</span>
    ${(!inspector&&d.seq!=null)?`<button class="lnk" data-seq="${esc(d.seq)}"
      >${esc(t("review.open_in_replay"))}</button>`:""}</div>`;
  if(inspector)
    h+=`<div class="mini"><b>${esc(t("inspector.chosen"))}</b>

  if(lethal){

    if(d.label_conf!=null&&d.label_conf<0.9)

  }
  h+=choicesHtml(chosen.choices);

  else{

function chosenText(chosen,e){
  const parts=[e.what||""];
  if(chosen.card&&String(e.what||"").indexOf(String(chosen.card))<0)
    parts.push(String(chosen.card));
  const tgt=targetName(chosen.target_id);
  if(tgt) parts.push("-> "+tgt);
  return parts.filter(Boolean).join(" ");
}
/* Hand-rolled SVG: no build step, no chart library. Every `logistic_v1`
   run is filled with the diagonal hatch pattern (design §3.3). */
function sparkline(series,moments){
  if(!series.length)
    return `<p class="small">${esc(t("review.no_wp"))}</p>`;
  const W=640, H=140, P=12, B=H-P, n=series.length;
  const px=i=>P+(W-2*P)*(n>1?i/(n-1):0.5);
  const py=v=>P+(H-2*P)*(1-Math.max(0,Math.min(1,Number(v)||0)));
  let areas="", i=0;
  while(i<n){
    let j=i;
    while(j+1<n&&series[j+1].source===series[i].source) j++;
    const hatched=series[i].source==="logistic_v1";
    let d="M"+px(i).toFixed(1)+","+B.toFixed(1);
    for(let k=i;k<=j;k++) d+=" L"+px(k).toFixed(1)+","+py(series[k].wp).toFixed(1);
    d+=" L"+px(j).toFixed(1)+","+B.toFixed(1)+" Z";
    areas+=`<path d="${d}" stroke="none"
      fill="${hatched?"url(#wpHatch)":"var(--card2)"}"></path>`;
    i=j+1;
  }
  const line=series.map((p,k)=>(k?"L":"M")+px(k).toFixed(1)+","+
    py(p.wp).toFixed(1)).join(" ");
  let marks="";
  (moments||[]).forEach(m=>{
    if(m.label!=="missed_lethal") return;
    let idx=-1;
    for(let k=0;k<n;k++) if(m.seq!=null&&series[k].seq===m.seq){idx=k; break;}
    if(idx<0) for(let k=0;k<n;k++) if(series[k].turn===m.turn){idx=k; break;}
    if(idx<0) return;
    marks+=`<line x1="${px(idx).toFixed(1)}" y1="${P}"
      x2="${px(idx).toFixed(1)}" y2="${B}" stroke="var(--neg)"
      stroke-width="1.5" stroke-dasharray="3 3"></line>
      <circle cx="${px(idx).toFixed(1)}" cy="${py(series[idx].wp).toFixed(1)}"
      r="4" fill="var(--neg)"></circle>`;
  });
  return `<svg class="wp" viewBox="0 0 ${W} ${H}" role="img"
    aria-label="${esc(t("review.wp_title"))}"><defs>
    <pattern id="wpHatch" width="7" height="7" patternUnits="userSpaceOnUse"
      patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="var(--ink2)"
        stroke-width="2.5" opacity=".38"></line></pattern></defs>
    <line x1="${P}" y1="${py(0.5).toFixed(1)}" x2="${W-P}"
      y2="${py(0.5).toFixed(1)}" stroke="var(--border)"
      stroke-dasharray="4 4"></line>
    ${areas}
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2"></path>
    ${marks}
    <text x="${P}" y="${P+10}" font-size="10" fill="var(--ink2)">100%</text>
    <text x="${P}" y="${B-2}" font-size="10" fill="var(--ink2)">0%</text>
    </svg>`;
}

/* ------------------------------------------- S3 replay + S4 inspector */
/* The MVP replay is a log-style list plus a compact CSS-grid board
   (design §6.2 S3, §7.1 fallback order). Snapshots come from the store;
   this screen never re-reduces events. */
let replayId=null, replayReview=null, snaps=[], snapIdx=0;
let playTimer=null, cardCache={}, replayDecs={};
const PLAY_MS=500;                 /* 2 actions per second */
const CARD_BATCH=400;              /* server cap per /api/cards call */

function pidGet(map,pid){
  if(!map) return undefined;
  /* JSON turns the int player ids into strings on the way out. */
  return map[pid]!==undefined?map[pid]:map[String(pid)];
}
function numOf(v){
  if(v==null) return 0;
  if(Array.isArray(v)) return v.length;
  if(typeof v==="object") return Number(v.count||v.n||0)||0;
  return Number(v)||0;
}
function vsUs(vs){return vs.us==null?1:vs.us;}
function vsThem(vs){return vsUs(vs)===1?2:1;}
function turnOf(i){
  const s=snaps[i];
  return ((s||{}).visible||{}).turn||0;
}
function entName(e,fallback){
  const c=(e&&e.card_id&&cardCache[e.card_id])||null;
  return (c&&c.name)||(e&&e.name)||fallback||t("replay.card_unknown");
}
function cardTip(e,fallback){
  const c=(e&&e.card_id&&cardCache[e.card_id])||null;
  const parts=[entName(e,fallback)];
  if(c){
    parts.push(t("replay.tip_stats",{cost:c.cost==null?"?":c.cost,
      atk:c.atk==null?"?":c.atk,hp:c.hp==null?"?":c.hp,
      type:c.type||""}));
    if(c.text) parts.push(String(c.text).replace(/<[^>]*>/g," ")
      .replace(/\s+/g," ").trim());
    if(c.implemented===false){
      parts.push(t("replay.not_implemented"));
      if(c.notes) parts.push(String(c.notes));
    }
  }
  return parts.filter(Boolean).join(" · ");
}
function targetName(eid){
  if(eid==null) return "";
  const vs=((snaps[snapIdx]||{}).visible)||{};
  for(const key of ["boards","hands"]){
    const m=vs[key]||{};
    for(const pk of Object.keys(m))
      for(const ent of (m[pk]||[]))
        if(ent&&ent.eid===eid) return entName(ent);
  }
  const heroes=vs.heroes||{};
  for(const pk of Object.keys(heroes)){
    const hero=heroes[pk]||{};
    if(hero.eid===eid) return entName(hero,t("replay.hero"));
  }
  return "#"+eid;
}
async function openReplay(id,seq){
  if(id==null) return;
  showTab("replay");
  if(replayId!==id){replayId=id; await loadReplay();}
  if(seq!=null&&snaps.length) snapIdx=idxForSeq(seq);
  renderReplay();
  if(seq!=null) scrollLogToCurrent();
}
function idxForSeq(seq){
  let nearest=0;
  for(let i=0;i<snaps.length;i++){
    if(snaps[i].event_seq===seq) return i;
    if(snaps[i].event_seq<=seq) nearest=i;
  }
  return nearest;
}
async function loadReplay(){
  stopPlay();
  snaps=[]; snapIdx=0; cardCache={}; replayDecs={}; replayReview=null;
  $("rpHead").innerHTML=`<p class="small">${esc(t("common.loading"))}</p>`;
  try{
    if(!labelsMeta){
      try{labelsMeta=await getJSON("/api/labels");}catch(e){labelsMeta=null;}
    }
    const d=await getJSON(gameUrl(replayId,"replay"));
    if(d.error) throw new Error(d.error);
    snaps=d.snapshots||[];
    await loadCards(snaps);
    await loadReplayDecisions();
  }catch(e){
    $("rpHead").innerHTML=`<p class="err">${esc(e.message)}</p>`;
  }
}
function collectCardIds(list){
  const ids={};
  list.forEach(s=>{
    const vs=s.visible||{};
    for(const key of ["boards","hands"]){
      const m=vs[key]||{};
      Object.keys(m).forEach(pk=>(m[pk]||[]).forEach(e=>{
        if(e&&e.card_id) ids[e.card_id]=1;
      }));
    }
    const w=vs.weapons||{};
    Object.keys(w).forEach(pk=>{
      const x=w[pk]; if(x&&x.card_id) ids[x.card_id]=1;
    });
    const heroes=vs.heroes||{};
    Object.keys(heroes).forEach(pk=>{
      const x=heroes[pk]; if(x&&x.card_id) ids[x.card_id]=1;
    });
  });
  return Object.keys(ids);
}
/* Names for the replay come from HSJSON, unimplemented cards included. */
async function loadCards(list){
  const ids=collectCardIds(list);
  for(let i=0;i<ids.length;i+=CARD_BATCH){
    try{
      const d=await api("/api/cards",{ids:ids.slice(i,i+CARD_BATCH)});
      if(d&&d.cards) Object.assign(cardCache,d.cards);
    }catch(e){}
  }
}
async function loadReplayDecisions(){
  try{
    const rv=await getJSON(gameUrl(replayId,"review"));
    if(rv&&rv.status==="ready"){
      replayReview=rv;
      (rv.turns||[]).forEach(tn=>(tn.decisions||[]).forEach(d=>{
        if(d.seq!=null) replayDecs[d.seq]=d;
      }));
    }
  }catch(e){}
}
function toggleHide(el,on){
  if(el&&el.classList) el.classList.toggle("hide",!!on);
}
function updatePlayBtn(){
  const b=$("rpPlay");
  if(b) b.textContent=playTimer?t("replay.pause"):t("replay.play");
}
function renderReplay(){
  if(!$("rpBoard")) return;
  updatePlayBtn();
  const has=snaps.length>0;
  toggleHide($("rpCtl"),!has);
  toggleHide($("rpScrub"),!has);
  toggleHide($("rpLogWrap"),!has);
  if(!replayId){
    $("rpHead").innerHTML=`<div class="card-block">
      <p>${esc(t("replay.pick"))}</p>
      <button class="btn sec" id="bRpGames">${esc(t("review.to_games"))}
      </button></div>`;
    const g=$("bRpGames"); if(g) g.onclick=()=>showTab("games");
    $("rpBoard").innerHTML=""; $("rpInspect").innerHTML="";
    $("rpLog").innerHTML="";
    return;
  }
  if(!has){
    $("rpHead").innerHTML=`<div class="card-block"><p class="small">
      ${esc(t("replay.no_snapshots"))}</p></div>`;
    $("rpBoard").innerHTML=""; $("rpInspect").innerHTML="";
    $("rpLog").innerHTML="";
    return;
  }
  if(snapIdx<0) snapIdx=0;
  if(snapIdx>snaps.length-1) snapIdx=snaps.length-1;
  const s=snaps[snapIdx], vs=s.visible||{};
  $("rpScrub").max=String(snaps.length-1);
  $("rpScrub").value=String(snapIdx);
  $("rpHead").innerHTML=replayMetaHtml(s,vs);
  const back=$("bRpReview");
  if(back) back.onclick=()=>{
    reviewId=replayId; showTab("review"); loadReview();
  };
  $("rpBoard").innerHTML=boardHtml(vs);
  $("rpInspect").innerHTML=inspectHtml(s);
  $("rpLog").innerHTML=logHtml();
  $("rpLog").querySelectorAll(".lrow").forEach(el=>{
    el.onclick=()=>{
      stopPlay();
      snapIdx=Number(el.getAttribute("data-i"))||0;
      renderReplay();
    };
  });
}
function replayMetaHtml(s,vs){
  const mine=vs.current_player===vsUs(vs);
  return `<div class="rmeta">
    <b>${esc(t("review.turn_n",{n:vs.turn||0}))}</b>
    <span class="tag">${esc(t("replay.of",{i:snapIdx+1,n:snaps.length}))}
    </span>
    <span class="tag">${esc(t("replay.ply",{seq:s.event_seq}))}</span>
    <span class="tag">${esc(mine?t("replay.side_us"):t("replay.side_them"))}
    </span>
    <span class="badge">${esc(t("replay.search_off"))}</span>
    ${s.lethal_ok?"":`<span class="badge">${esc(t("replay.lethal_off"))}
      </span>`}
    ${s.wp==null?"":`<span class="chip" title="${esc(wpCaveat())}"
      >${esc(t("replay.wp",{v:Math.round(s.wp*100)}))}</span>`}
    <button class="btn sec" id="bRpReview">${esc(t("replay.to_review"))}
    </button>
    ${(s.unimplemented||[]).length?`<div class="mini">${esc(
      t("replay.unimplemented",{cards:(s.unimplemented||[]).join(", ")}))}
      </div>`:""}
    </div>`;
}
function manaText(m){
  m=m||{};
  const cr=m.crystals||0;
  const avail=Math.max(0,cr-(m.used||0)-(m.overload||0)+(m.temp||0));
  return t("replay.mana",{n:avail,of:cr});
}
function entHtml(e,inHand){
  const tags=e.tags||{};
  const cls="ent"+(tags.TAUNT?" taunt":"")+(tags.DIVINE_SHIELD?" ds":"")+
    (e.card_id&&cardCache[e.card_id]&&
     cardCache[e.card_id].implemented===false?" unimpl":"");
  const atk=e.atk!=null?e.atk:0;
  const hp=e.health==null?null:e.health-(e.damage||0);
  const cost=e.cost;
  const stats=inHand
    ? (cost==null?"":"("+cost+")")+(e.health==null?"":" "+atk+"/"+hp)
    : (e.health==null&&!atk?"":atk+"/"+(hp==null?"?":hp));
  return `<div class="${cls}" title="${esc(cardTip(e))}">
    <div class="nm">${esc(entName(e))}</div>
    <div class="st">${esc(stats)}</div></div>`;
}
function backsHtml(n){
  let h="";
  for(let i=0;i<Math.min(n,10);i++) h+=`<div class="ent back">?</div>`;
  return h+`<span class="chip">${esc(t("replay.hand_hidden",{n}))}</span>`;
}
function heroHtml(vs,pid){
  const hero=pidGet(vs.heroes,pid)||{};
  const wpn=pidGet(vs.weapons,pid)||null;
  const hp=hero.hp==null?"?":hero.hp;
  const armor=hero.armor||0;
  const atk=hero.atk||0;
  const wd=wpn?(wpn.durability!=null?wpn.durability:(wpn.dur||0)):0;
  return `<div class="ent hero" title="${esc(cardTip(hero,t("replay.hero")))}">
    <div class="nm">${esc(entName(hero,t("replay.hero")))}</div>
    <div class="st">${esc(t("replay.hp",{n:hp}))}${armor?
      " +"+esc(armor):""}${atk?" · "+esc(t("replay.atk",{n:atk})):""}</div>
    ${wpn?`<div class="st">${esc(t("replay.weapon",{a:wpn.atk||0,d:wd}))}
      </div>`:""}</div>`;
}
function sideHtml(vs,pid,mine){
  const hand=pidGet(vs.hands,pid)||[];
  const board=pidGet(vs.boards,pid)||[];
  const none=`<span class="mini">${esc(t("replay.empty_board"))}</span>`;
  const boardRow=`<div class="rrow mid">${board.length?
    board.map(e=>entHtml(e,false)).join(""):none}</div>`;
  const handRow=`<div class="rrow">${mine?
    (hand.length?hand.map(e=>entHtml(e,true)).join(""):none)
    :backsHtml(hand.length)}</div>`;
  const secrets=numOf(pidGet(vs.secrets,pid));
  const corpses=numOf(pidGet(vs.corpses,pid));
  const metaRow=`<div class="rrow">${heroHtml(vs,pid)}
    <span class="chip">${esc(manaText(pidGet(vs.mana,pid)))}</span>
    <span class="chip">${esc(t("replay.deck",
      {n:numOf(pidGet(vs.deck_counts,pid))}))}</span>
    ${secrets?`<span class="chip">${esc(t("replay.secrets",
      {n:secrets}))}</span>`:""}
    ${corpses?`<span class="chip">${esc(t("replay.corpses",
      {n:corpses}))}</span>`:""}
    <span class="tag">${esc(mine?t("replay.side_us")
      :t("replay.side_them"))}</span></div>`;
  return mine?boardRow+metaRow+handRow:handRow+metaRow+boardRow;
}
function boardHtml(vs){
  return `<div class="rboard">${sideHtml(vs,vsThem(vs),false)}
    <div class="rline"></div>${sideHtml(vs,vsUs(vs),true)}</div>`;
}
function inspectHtml(s){
  const d=replayDecs[s.event_seq];
  let h=`<div class="card-block"><h2>${esc(t("inspector.title"))}</h2>`;
  if(!d)
    h+=`<p class="small">${esc(t("inspector.none"))}</p>
      <div class="caveats"><b>${esc(t("inspector.why_wrong"))}</b>
      <div>${esc(t("review.search_off"))}</div></div>`;
  else h+=decHtml(d,true);
  return h+"</div>";
}
function logHtml(){
  return snaps.map((s,i)=>{
    const vs=s.visible||{};
    const d=replayDecs[s.event_seq];
    const side=d?d.side:(vs.current_player===vsUs(vs)?"us":"them");
    const what=d?((d.explanation||{}).what||tk("kind",d.kind))
      :t("replay.state_only");
    const lab=(d&&d.label)?tk("label",d.label):"";
    return `<div class="lrow${i===snapIdx?" on":""}${
      side==="them"?" them":""}" data-i="${i}">
      <span class="mini">${esc(t("replay.ply",{seq:s.event_seq}))}</span>
      <span class="mini">${esc(t("review.turn_n",{n:vs.turn||0}))}</span>
      <span>${esc(what)}</span>
      ${lab?`<span class="glyph">${esc(lab)}</span>`:""}</div>`;
  }).join("");
}
function scrollLogToCurrent(){
  const w=$("rpLogWrap"); if(w) w.open=true;
  const log=$("rpLog");
  const el=(log&&log.querySelector)?log.querySelector(".lrow.on"):null;
  if(el&&el.scrollIntoView) el.scrollIntoView({block:"nearest"});
}
function rpGo(i){
  snapIdx=Math.max(0,Math.min(snaps.length-1,i));
  renderReplay();
  scrollLogToCurrent();
}
function rpStep(n){stopPlay(); rpGo(snapIdx+n);}
function rpTurn(dir){
  stopPlay();
  const cur=turnOf(snapIdx);
  if(dir>0){
    for(let i=snapIdx+1;i<snaps.length;i++)
      if(turnOf(i)>cur) return rpGo(i);
    return rpGo(snaps.length-1);
  }
  let i=snapIdx;
  while(i>0&&turnOf(i-1)===cur) i--;
  if(i===snapIdx&&i>0) i--;
  const target=turnOf(i);
  while(i>0&&turnOf(i-1)===target) i--;
  return rpGo(i);
}
function stopPlay(){
  if(playTimer){clearInterval(playTimer); playTimer=null;}
}
function startPlay(){
  if(playTimer||!snaps.length) return;
  playTimer=setInterval(()=>{
    if(snapIdx>=snaps.length-1){stopPlay(); renderReplay(); return;}
    snapIdx++; renderReplay();
  },PLAY_MS);
}
function rpToggle(){
  if(playTimer) stopPlay(); else startPlay();
  renderReplay();
}

/* ----------------------------------------------------------- S0 import */
async function runImport(promise){
  $("bImport").disabled=true; $("bImportLast").disabled=true;
  $("outI").innerHTML="";
  try{
    const d=await promise;
    if(d.error) throw new Error(d.error);
    if(d.path) $("outI").innerHTML=
      `<p class="small">${esc(t("import.reading",{path:d.path}))}</p>`;
    const r=await poll(d.job,$("progI"));
    if(r.status==="error") throw new Error(r.error);
    const ids=(r.result&&r.result.games)||[];
    $("outI").innerHTML+=`<p class="good">${esc(t("import.done",
      {n:ids.length}))}</p>
      <button class="btn" id="bAfterImport">${esc(t("import.to_games"))}
      </button>`;
    $("bAfterImport").onclick=()=>{showTab("games"); loadGames();};
    await loadGames();
  }catch(e){
    $("outI").innerHTML=`<p class="err">${esc(e.message)}</p>`;
  }
  $("bImport").disabled=false; $("bImportLast").disabled=false;
}
function copyCfg(){
  const text=$("logcfg").textContent;
  const done=()=>{
    const b=$("bCopyCfg");
    b.textContent=t("import.copied");
    setTimeout(()=>{b.textContent=t("import.copy");},1600);
  };
  const fallback=()=>{
    const ta=document.createElement("textarea");
    ta.value=text; document.body.appendChild(ta); ta.select();
    try{document.execCommand("copy"); done();}catch(e){}
    ta.remove();
  };
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText)
      return navigator.clipboard.writeText(text).then(done,fallback);
  }catch(e){}
  fallback();
}

  $("sModeLine").checked=mode!=="hint";
  if(settings.deckstring&&!$("code").value.trim())
    $("code").value=settings.deckstring;
  return settings;
}
async function saveSettings(){
  $("bSaveSettings").disabled=true;
  try{
    const body={logs_dir:$("sLogs").value.trim(),
      player_name:$("sPlayer").value.trim(),
      deckstring:$("sDeck").value.trim()||$("code").value.trim(),
      language:$("sLang").value,
      live_eval:$("sLive").checked?"1":"0",
      live_lethal_mode:"line"};

    if(d.error) throw new Error(d.error);
    settings=d.settings||body;

    await setLang(settings.language||lsGet(LS_LANG));

    $("outS").innerHTML=`<p class="err">${esc(e.message)}</p>`;
  }
  $("bSaveSettings").disabled=false;
}

/* ------------------------------------------------------------- startup */
function wire(){
  $("bGames").onclick=loadGames;
  $("gClass").onchange=loadGames;
  $("gResult").onchange=loadGames;
  $("bImport").onclick=()=>{
    const p=$("iPath").value.trim();
    if(!p) return $("outI").innerHTML=
      `<p class="err">${esc(t("import.need_path"))}</p>`;
    runImport(api("/api/import/log",{path:p}));
  };
  $("bImportLast").onclick=()=>runImport(
    api("/api/import/last_session",{logs_dir:$("sLogs").value.trim()}));
  $("bCopyCfg").onclick=copyCfg;
  $("rpFirst").onclick=()=>{stopPlay(); rpGo(0);};
  $("rpLast").onclick=()=>{stopPlay(); rpGo(snaps.length-1);};
  $("rpPrev").onclick=()=>rpStep(-1);
  $("rpNext").onclick=()=>rpStep(1);
  $("rpPrevTurn").onclick=()=>rpTurn(-1);
  $("rpNextTurn").onclick=()=>rpTurn(1);
  $("rpPlay").onclick=rpToggle;
  $("rpScrub").oninput=()=>{
    stopPlay();
    snapIdx=Number($("rpScrub").value)||0;
    renderReplay();
  };
  $("bSaveSettings").onclick=saveSettings;
  $("sLang").onchange=()=>setLang($("sLang").value);
}
(async function init(){
  await setLang(lsGet(LS_LANG));
  wire();
  const st=await loadSettings();
  if(st&&st.language&&pickLang(st.language)!==LANG) await setLang(st.language);
  loadCardNames();
  const rows=await loadGames();
  if(!rows.length) showTab("import");
})();
